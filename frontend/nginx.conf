server {
  listen 80;
  server_name localhost;

  location / {
    root   /usr/share/nginx/html;
    index  index.html;
    # Bu satır en önemlisi: Eğer bir dosya veya klasör bulunamazsa,
    # 404 hatası vermek yerine index.html'i gösterir.
    # Bu, React Router'ın sayfa yönlendirmelerini devralmasını sağlar.
    try_files $uri $uri/ /index.html;
  }
}