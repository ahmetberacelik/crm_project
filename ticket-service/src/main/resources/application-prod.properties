# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
# The application port is read from the TICKET_SERVER_PORT variable in the .env file.
server.port=${TICKET_SERVER_PORT}

# ===================================================================
# R2DBC (REACTIVE DATABASE) CONFIGURATION
# ===================================================================
spring.r2dbc.url=${R2DBC_URL}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${MSSQL_SA_PASSWORD}

# R2DBC Connection Pool Configuration
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-create-connection-time=10s

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://user-service:${USER_SERVER_PORT}

# ===================================================================
# FLYWAY CONFIGURATION FOR DATABASE MIGRATIONS
# ===================================================================
spring.flyway.enabled=true
# CRITICAL: Each service must have its own unique Flyway history table.
spring.flyway.table=flyway_schema_history_ticket
# Flyway uses a standard JDBC URL.
spring.flyway.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=false
spring.flyway.user=${DB_USER}
spring.flyway.password=${MSSQL_SA_PASSWORD}
spring.flyway.baseline-on-migrate=true



management.endpoint.health.probes.enabled=true

management.endpoints.web.exposure.include=*




# ===================================================================
# INTER-SERVICE COMMUNICATION
# ===================================================================
# Base URL for calling the department-service via WebClient.
department.base-url=${DEPARTMENT_SERVICE_URL}

# ===================================================================
# JWT (JSON WEB TOKEN) CONFIGURATION
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.com.crm.ticket=DEBUG