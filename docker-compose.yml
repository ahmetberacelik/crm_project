services:
  # User Service Application
  user-service:
    # Build the Docker image for the user-service.
    # The 'context' is set to the project root directory ('.') so that the Dockerfile
    # can access both the parent pom.xml and the user-service module.
    build:
      context: .
      dockerfile: user-service/Dockerfile
      args:
        USER_SERVER_PORT: ${USER_SERVER_PORT}
    # The container name for easier identification.
    container_name: user-service
    # Read environment variables from the .env file in the root directory.
    #    environment:
    #      - SPRING_FLYWAY_REPAIR=true
    env_file:
      - .env
    # Map the host port to the container port. Uses USER_SERVER_PORT from .env.
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    # Define the network this service will connect to.
    networks:
      - crm-network
    # This ensures that the user-service container starts only after the mssql-db
    # container is started. NOTE: It does not guarantee the database is ready.
    depends_on:
      mssql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${USER_SERVER_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Automatically restart the container unless it was manually stopped.
    restart: unless-stopped

  # Department Service
  department-service:
    build:
      context: .
      dockerfile: department-service/Dockerfile
      args:
        DEPARTMENT_SERVER_PORT: ${DEPARTMENT_SERVER_PORT}
    container_name: department-service
    env_file:
      - .env
    ports:
      - "${DEPARTMENT_SERVER_PORT}:${DEPARTMENT_SERVER_PORT}"
    networks:
      - crm-network
    depends_on:
      mssql-db:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped

  # Microsoft SQL Server Database
  mssql-db:
    # Use the official Microsoft SQL Server 2019 image for Linux.
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    # The container name for the database service.
    container_name: mssql-db
    # Set environment variables required for MS SQL Server.
    # 'ACCEPT_EULA=Y' is mandatory.
    # The SA password is read securely from the .env file.
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    # Map the host port to the container's SQL Server port (1433).
    ports:
      - "${DB_PORT}:1433"
    # Use a named volume for data and mount our custom initialization scripts.
    volumes:
      - mssql-data:/var/opt/mssql
      - ./mssql:/usr/src/app
    # Define the network for communication with the user-service.
    networks:
      - crm-network
    # Define the custom command to run our initialization script.
    command: /bin/bash /usr/src/app/run-init.sh
    # Healthcheck is re-enabled to work with the custom init script.
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -N -C
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Automatically restart the container.
    restart: unless-stopped

# Define the shared network for inter-service communication.
networks:
  crm-network:
    driver: bridge

# Define the named volume for data persistence.
volumes:
  mssql-data:
    driver: local