# ================================================================
# SERVER CONFIGURATION
# ================================================================
server.port=${DEPARTMENT_SERVER_PORT}

# ================================================================
# R2DBC (REACTIVE DATABASE) CONFIGURATION
# ================================================================
spring.r2dbc.url=${R2DBC_URL}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${MSSQL_SA_PASSWORD}

spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

# ================================================================
# FLYWAY CONFIGURATION
# ================================================================
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_department
spring.flyway.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.flyway.user=${DB_USER}
spring.flyway.password=${MSSQL_SA_PASSWORD}
spring.flyway.baseline-on-migrate=true


management.endpoint.health.probes.enabled=true

management.endpoints.web.exposure.include=*



# ================================================================
# JWT CONFIGURATION (shared with other services)
# ================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ================================================================
# LOGGING
# ================================================================
logging.level.com.crm.department=DEBUG


