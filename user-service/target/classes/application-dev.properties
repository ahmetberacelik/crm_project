# ===================================================================
# R2DBC (Reactive Database) Configuration
# ===================================================================
# Uygulama portu .env'deki USER_SERVER_PORT değişkeninden okunur.
server.port=${USER_SERVER_PORT}

spring.r2dbc.url=${R2DBC_URL}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${MSSQL_SA_PASSWORD}

# Enable and configure the R2DBC connection pool for better performance.
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

department.base-url=http://department-service:${DEPARTMENT_SERVER_PORT}

# ===================================================================
# Flyway Configuration for Database Migrations
# ===================================================================
# Explicitly enable Flyway.
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_user
# Flyway uses a standard JDBC URL. We construct it from our environment variables.
# The 'encrypt' and 'trustServerCertificate' properties are needed to connect to the self-signed cert in Docker.
spring.flyway.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.flyway.user=${DB_USER}
spring.flyway.password=${MSSQL_SA_PASSWORD}

# ===================================================================
# Logging Configuration
# ===================================================================
# Set the logging level for our application's packages to DEBUG for detailed logs during development.
logging.level.com.crm=DEBUG
# Uncomment the line below to see R2DBC-specific SQL queries and operations.
# logging.level.org.springframework.r2dbc=DEBUG

# ===================================================================
# JWT (JSON Web Token) Configuration
# ===================================================================
# Custom properties for JWT generation and validation.
# These will be mapped to a @ConfigurationProperties class.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}